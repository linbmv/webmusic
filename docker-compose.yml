services:
  webmusic:
    build: .
    image: webmusic:latest
    ports:
      # 宿主端口可在 .env 用 WEBMUSIC_PORT 覆盖，容器内固定 8080
      - "${WEBMUSIC_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATA_DIR: "/data"
      DOWNLOAD_DIR: "/data/downloads"
      # 新用户注册开关：true 开启，false 关闭（老用户仍可登录）。在 .env 覆盖
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
      # HTTPS 反向代理 Cookie Secure：留空=按 X-Forwarded-Proto 自动判定（推荐）；
      # 显式 true/false 可强制覆盖。详见 README「HTTPS 反向代理与 Cookie 安全」
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      # 可选：仅在使用 Karpov provider 时需要
      KARPOV_API_KEY: "${KARPOV_API_KEY:-}"
      # 可选：自建 NeteaseCloudMusicApi 地址，用于歌单/歌词/搜索兜底。
      # 默认指向同 Docker 网络里的服务名；未部署该服务时网易云兜底会自动失败，不影响主源。
      NETEASE_API_BASE: "${NETEASE_API_BASE:-http://netease-cloud-music-api:3000}"
    volumes:
      # 数据持久化目录，宿主路径可在 .env 用 WEBMUSIC_DATA_DIR 覆盖
      - "${WEBMUSIC_DATA_DIR:-./webmusic-data}:/data"
    networks:
      - app-net
    restart: unless-stopped

networks:
  # 接入一个已存在的外部 Docker 网络（须预先存在，如反代/其它服务共用的网络）。
  # 真实网络名由 .env 的 WEBMUSIC_NETWORK 指定；外部网络自带网段/IP 管理。
  # 同网络内的反代等容器可用服务名 webmusic:8080 直接互通，无需固定 IP。
  app-net:
    name: "${WEBMUSIC_NETWORK:-webmusic-net}"
    external: true


