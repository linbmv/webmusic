services:
  webmusic:
    build: .
    image: webmusic:latest
    ports:
      # 宿主端口可在 .env 用 WEBMUSIC_PORT 覆盖，容器内固定 8080
      - "${WEBMUSIC_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATA_DIR: "/data"
      DOWNLOAD_DIR: "/data/downloads"
      # 新用户注册开关：true 开启，false 关闭（老用户仍可登录）。在 .env 覆盖
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
      # HTTPS 反向代理 Cookie Secure：留空=按 X-Forwarded-Proto 自动判定（推荐）；
      # 显式 true/false 可强制覆盖。详见 README「HTTPS 反向代理与 Cookie 安全」
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      # 可选：仅在使用 Karpov provider 时需要
      KARPOV_API_KEY: "${KARPOV_API_KEY:-}"
    volumes:
      # 数据持久化目录，宿主路径可在 .env 用 WEBMUSIC_DATA_DIR 覆盖
      - "${WEBMUSIC_DATA_DIR:-./webmusic-data}:/data"
    networks:
      webmusic-net:
        # 固定容器 IP，可在 .env 用 WEBMUSIC_IP 覆盖；须落在 WEBMUSIC_SUBNET 网段内
        ipv4_address: "${WEBMUSIC_IP:-172.28.0.10}"
    restart: unless-stopped

networks:
  # 独立自定义 bridge 网络；真实网络名/网段/网关可在 .env 覆盖，避免与宿主已有 Docker 网络冲突
  webmusic-net:
    name: "${WEBMUSIC_NETWORK:-webmusic-net}"
    driver: bridge
    ipam:
      config:
        - subnet: "${WEBMUSIC_SUBNET:-172.28.0.0/24}"
          gateway: "${WEBMUSIC_GATEWAY:-172.28.0.1}"

